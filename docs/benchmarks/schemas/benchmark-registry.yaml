benchmark_registry:
  schema_version: "1.1"
  registry_version: "1.1"
  owner: "Thomas Giza / Aetheris Consulting"
  status: "canonical_working_architecture"
  parent_architecture: "ACIM-E v1.0"
  updated_at: "2026-07-10"

  doctrine:
    evaluated_unit: "complete AI-enabled workflow or system configuration"
    primary_rule: "Evaluate governed state change, not answer accuracy alone."
    hard_gate_rule: "A failed hard gate cannot be offset by a composite score."
    authority_rule: "Execution agents do not own organizational commit authority."
    baseline_rule: "Human or current-process performance is a contextual comparator, not an assumed gold standard."
    calibration_rule: "Benchmark scores remain provisional until compared with protected real-world outcomes."

  core_benchmarks:
    - benchmark_id: "GPO-Bench"
      long_name: "Governed Production Operations Benchmark"
      track: "production_manufacturing"
      status: "working_specification"
      sub_benchmarks:
        - "GPO-QC"
        - "GPO-BizOps"
        - "GPO-CICD"
        - "GPO-XLayer"
        - "GPO-Gov"
      killer_metric: "Did the system prevent bad operational state from moving forward while preserving authority, traceability, safety, and recoverability?"

    - benchmark_id: "SciDisc-Bench"
      long_name: "Scientific Discovery Benchmark"
      track: "scientific_discovery"
      status: "working_specification"
      sub_benchmarks:
        - "SciDisc-LitSynth"
        - "SciDisc-HypGen"
        - "SciDisc-ExpDesign"
        - "SciDisc-Sim"
        - "SciDisc-Causal"
        - "SciDisc-Rediscovery"
        - "SciDisc-Replication"
        - "SciDisc-Prospective"
      killer_metric: "Did the system move a candidate claim through a valid evidence-generation path without epistemic overreach, methodological failure, safety violation, or authority-boundary breach?"

    - benchmark_id: "Medical-Bench"
      long_name: "High-Liability Clinical and Health-System Operations Benchmark"
      track: "medical"
      status: "working_specification"
      sub_benchmarks:
        - "Med-Dx"
        - "Med-Tx"
        - "Med-Doc"
        - "Med-HighLiability"
        - "Med-Research"
        - "Med-Ops"
      killer_metric: "Did the system improve or preserve patient and health-system outcomes through valid clinical support and correct authority behavior, without false dismissal, hidden burden, or unsafe action?"

    - benchmark_id: "Optimization-Bench"
      long_name: "Organizational and Operational Optimization Benchmark"
      track: "organizational_optimization"
      status: "working_specification"
      sub_benchmarks:
        - "Opt-Problem"
        - "Opt-Model"
        - "Opt-Solve"
        - "Opt-Explain"
        - "Opt-Impact"
        - "Opt-Route"
        - "Opt-Adaptive"
      killer_metric: "Did the system produce a feasible, explainable, authority-valid improvement that survives operational reality and does not transfer harm, burden, or risk elsewhere?"

    - benchmark_id: "Education-Bench"
      long_name: "Education and Human Capability Benchmark"
      track: "education_human_capability"
      status: "working_specification"
      sub_benchmarks:
        - "Edu-Content"
        - "Edu-PedDesign"
        - "Edu-Adaptive"
        - "Edu-Assessment"
        - "Edu-Curriculum"
        - "Edu-Transfer"
      killer_metric: "Did the learner develop correct, durable, transferable capability without AI-introduced misconceptions, authority violations, dependency, or harm?"

  cross_cutting_benchmarks:
    note: "Canonical identifiers retained. Long-form names and formal definitions are not yet frozen."
    benchmarks:
      - benchmark_id: "TSC"
        formal_name_status: "unfrozen"
        status: "registry_placeholder"
      - benchmark_id: "SecOps"
        formal_name_status: "unfrozen"
        status: "registry_placeholder"
      - benchmark_id: "RevT"
        formal_name_status: "unfrozen"
        status: "registry_placeholder"
      - benchmark_id: "RegComp"
        formal_name_status: "unfrozen"
        status: "registry_placeholder"
      - benchmark_id: "OrgComm"
        formal_name_status: "unfrozen"
        status: "registry_placeholder"
      - benchmark_id: "WTT"
        formal_name_status: "unfrozen"
        status: "registry_placeholder"

  relational_benchmarks:
    note: "Canonical identifiers retained. Long-form names and formal definitions are not yet frozen."
    benchmarks:
      - benchmark_id: "IPeer"
        formal_name_status: "unfrozen"
        status: "registry_placeholder"
      - benchmark_id: "FedComp"
        formal_name_status: "unfrozen"
        status: "registry_placeholder"
      - benchmark_id: "Maturity"
        formal_name_status: "unfrozen"
        status: "registry_placeholder"

  meta_benchmark:
    benchmark_id: "CCIB"
    formal_name_status: "unfrozen"
    status: "registry_placeholder"
    minimum_scope:
      - "calibration"
      - "coverage"
      - "case diversity"
      - "anti-gaming controls"
      - "judge reliability"
      - "benchmark-to-outcome alignment"
      - "version governance"
      - "retirement discipline"

  utss_scenarios:
    - scenario_id: "Matrix-Test"
      purpose: "Hidden-state deception, conflicting control layers, and authorized-truth discrimination."
    - scenario_id: "Batdog-Protocol"
      purpose: "Cross-domain reconstruction, fragmented evidence integration, and resistance to invented authority."
    - scenario_id: "Apollo-13-CO2-Test"
      purpose: "Resource-constrained emergency reasoning, prioritization, improvisation, and safe communication."
    - scenario_id: "Groundhog-Day-Test"
      purpose: "Repeated-loop learning and measurable correction from prior failure evidence."

  benchmark_voc:
    status: "required_for_deployed_calibration"
    gap_classes:
      - "calibration_gap"
      - "coverage_gap"
      - "case_library_gap"
      - "authority_boundary_gap"
      - "human_baseline_gap"
      - "unknown_gap"
    outcome_validation_score:
      status: "provisional"
      range: "[-1.0, +1.0]"
      interpretation: "Correlation between normalized benchmark movement and normalized protected-outcome movement across cycles; not causal proof."
    hard_gate: "Suspend benchmark-driven optimization authority when repeated safety-critical outcome failures pass the benchmark suite."

  acim_e_gate_profile:
    - "Gate 0 — Organizational orientation"
    - "Gate 1 — Target workflow orientation"
    - "Gate 2 — Baseline and evidence sufficiency"
    - "Gate 3 — Candidate design authorization"
    - "Gate 4 — Forecast and simulation validation"
    - "Gate 5 — Pilot authorization"
    - "Gate 6 — Operational evaluation"
    - "Gate 7 — Reconciliation"
    - "Gate 8 — Organizational commit"

  required_registry_fields_for_operational_benchmark:
    - "canonical identifier and long-form name"
    - "owner and review body"
    - "purpose and non-goals"
    - "applicable tracks and domains"
    - "case schema and rights status"
    - "scoring method and hard gates"
    - "baseline requirements"
    - "protected countermetrics"
    - "development, validation, and holdout partitions"
    - "anti-gaming and leakage controls"
    - "judge governance"
    - "known limitations"
    - "production calibration status"
    - "version, retirement, and replacement rules"

  open_work:
    - "Freeze cross-cutting, relational, and meta benchmark names and definitions."
    - "Build rights-cleared case libraries and holdouts."
    - "Formalize scoring and judge-calibration protocols."
    - "Establish human/current-process baseline studies."
    - "Validate thresholds through pilots and production outcomes."
    - "Formalize OVS statistical rules."
    - "Implement leakage detection, rotation, and case retirement operations."